<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GitHub 发布工具{% endblock %}</title>
<style>
:root{--bg:#0b1220;--card:#151f33;--card2:#1b2740;--border:#25334f;--text:#e2e8f0;--muted:#8b9cba;--brand:#3b82f6;--brand2:#2563eb;--ok:#10b981;--err:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:#60a5fa;text-decoration:none}
a:hover{text-decoration:underline}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(21,31,51,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);flex-wrap:wrap}
.topbar h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.topbar nav{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.topbar nav a{color:var(--muted);position:relative;padding:4px 0;white-space:nowrap}
.topbar nav a:hover{color:var(--text);text-decoration:none}
.topbar nav a.active{color:#fff}
.topbar nav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:2px;background:var(--brand)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.15);overflow:hidden}
.card h2{margin:0 0 16px;font-size:15px;font-weight:600;color:#cbd5e1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .dot{width:6px;height:6px;background:var(--brand);border-radius:50%}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=password],input[type=file],select,textarea{width:100%;max-width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s;min-width:0}
input[type=file]{padding:8px 10px;overflow:hidden;text-overflow:ellipsis}
input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
textarea{min-height:100px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
button{padding:10px 18px;background:var(--brand);color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;margin-top:14px;transition:background .15s}
button:hover{background:var(--brand2)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
button.ghost:hover{background:var(--card2)}
button.danger{background:var(--err)}
button.danger:hover{background:#dc2626}
.msg{padding:11px 14px;border-radius:8px;margin-bottom:16px;font-size:14px}
.msg.ok{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.msg.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
pre.log{background:#050b17;border:1px solid #1e293b;border-radius:8px;padding:14px;font-size:12px;line-height:1.6;color:#94a3b8;overflow:auto;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace;max-width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.row{display:flex;gap:14px}
.row>*{flex:1;min-width:0}
.badge{display:inline-block;padding:2px 8px;font-size:11px;border-radius:4px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.badge.pending{background:rgba(245,158,11,.15);color:#fbbf24}
.badge.running{background:rgba(59,130,246,.15);color:#60a5fa}
.badge.success{background:rgba(16,185,129,.15);color:#34d399}
.badge.failed{background:rgba(239,68,68,.15);color:#f87171}
.badge.interrupted{background:rgba(139,92,246,.15);color:#a78bfa}
.task-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--card2);margin-bottom:8px;font-size:13px;flex-wrap:wrap}
.task-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:120px}
.task-item .time{color:var(--muted);font-size:12px;white-space:nowrap}
.task-item .actions{display:flex;gap:8px}
.task-item .actions button{margin:0;padding:4px 10px;font-size:12px}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.checkbox-row input{width:auto;margin:0}
.checkbox-row label{margin:0;color:var(--text);font-size:14px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}
@media(max-width:640px){
  .row{display:block}.row>*{margin-bottom:12px}
  .card{padding:16px}
  .wrap{padding:16px 12px 60px}
  .task-item .time{display:none}
  .topbar{padding:10px 12px}
  .topbar h1{font-size:13px}
  .topbar nav{gap:12px;font-size:12.5px}
}

/* repo-item */
.repo-item{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:10px;background:var(--card2);margin-bottom:10px;border:1px solid var(--border)}
@media(min-width:640px){.repo-item{flex-direction:row;align-items:center}}
.repo-main{flex:1;min-width:0}
.repo-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.repo-name{font-weight:600;font-size:14px}
.repo-desc{color:var(--muted);font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
.repo-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.repo-actions{display:flex;gap:6px;flex-wrap:wrap}
.repo-actions button{margin:0;padding:5px 12px;font-size:12px}
.repo-actions button.danger{background:transparent;border:1px solid var(--err);color:#fca5a5}
.repo-actions button.danger:hover{background:rgba(239,68,68,.15)}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);animation:fadeIn .15s ease;overflow:hidden}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:820px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .15s ease;min-width:0}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:#cbd5e1;flex-shrink:0}
.modal-head .modal-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.modal-close{background:transparent;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 10px;margin:0;border-radius:6px;line-height:1;flex-shrink:0}
.modal-close:hover{color:#fff;background:var(--card2)}
.modal-back{background:transparent;border:1px solid var(--border);color:var(--text);font-size:12.5px;cursor:pointer;padding:5px 10px;margin:0;border-radius:6px;line-height:1.2;flex-shrink:0}
.modal-back:hover{background:var(--card2)}
.modal-box pre.log{border:0;border-radius:0;max-height:none;flex:1;overflow:auto;margin:0;min-height:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* modal extras */
.modal-extras{padding:12px 16px;background:rgba(16,185,129,.06);border-bottom:1px solid var(--border);font-size:13px;flex-shrink:0;max-height:38%;overflow:auto;display:none}
.modal-extras.show{display:block}
.modal-extras .xrow{display:flex;align-items:flex-start;gap:10px;padding:4px 0;flex-wrap:wrap}
.modal-extras .xlabel{color:var(--muted);min-width:72px;flex-shrink:0;font-size:12px}
.modal-extras a{word-break:break-all;overflow-wrap:anywhere;font-size:12.5px}
.modal-extras a.accel{color:#34d399;font-weight:500}
.modal-extras .xname{color:var(--muted);font-size:11.5px;margin-left:4px}

/* 步骤条 */
.steps-bar{display:flex;align-items:center;gap:6px;padding:10px 16px;background:rgba(15,23,42,.6);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;font-size:12px}
.step-item{display:flex;align-items:center;gap:6px;flex-shrink:0;color:var(--muted);white-space:nowrap}
.step-dot{width:14px;height:14px;border-radius:50%;background:#334155;border:2px solid #334155;transition:all .2s;flex-shrink:0}
.step-item.active{color:#60a5fa}
.step-item.active .step-dot{background:var(--brand);border-color:var(--brand);animation:pulse 1.2s ease-in-out infinite}
.step-item.done{color:#34d399}
.step-item.done .step-dot{background:var(--ok);border-color:var(--ok)}
.step-item.failed{color:#f87171}
.step-item.failed .step-dot{background:var(--err);border-color:var(--err)}
.step-conn{width:14px;height:2px;background:#334155;flex-shrink:0}
.step-item.done + .step-conn{background:var(--ok)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.7}}
@media(max-width:640px){.steps-bar{padding:8px 10px;font-size:11px;gap:4px}.step-dot{width:12px;height:12px}.step-conn{width:8px}}

/* markdown 预览 */
.md-preview{background:#0f172a;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px;font-size:13.5px;line-height:1.7;color:var(--text);max-height:400px;overflow:auto}
.md-preview h1,.md-preview h2,.md-preview h3{margin:12px 0 8px;color:#cbd5e1;line-height:1.3}
.md-preview h1{font-size:18px;border-bottom:1px solid var(--border);padding-bottom:6px}
.md-preview h2{font-size:16px}
.md-preview h3{font-size:14px}
.md-preview p{margin:6px 0}
.md-preview code{background:#020617;padding:1px 5px;border-radius:4px;font-size:12px;color:#f472b6}
.md-preview pre{background:#020617;padding:10px;border-radius:6px;overflow:auto;font-size:12px}
.md-preview pre code{background:none;padding:0;color:#94a3b8}
.md-preview ul,.md-preview ol{padding-left:22px;margin:6px 0}
.md-preview li{margin:2px 0}
.md-preview a{color:#60a5fa}
.md-preview blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--muted);margin:8px 0}
.md-preview table{border-collapse:collapse;margin:8px 0}
.md-preview th,.md-preview td{border:1px solid var(--border);padding:5px 10px;font-size:12.5px}
.md-preview img{max-width:100%}

/* 文件列表 */
.file-list{flex:1;overflow:auto;padding:6px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#050b17;min-height:0}
.file-list .fitem{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:#cbd5e1;border-bottom:1px solid rgba(30,41,59,.5);user-select:none}
.file-list .fitem:hover{background:rgba(59,130,246,.12)}
.file-list .fitem .ficon{width:20px;text-align:center;flex-shrink:0}
.file-list .fitem .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list .fitem .fsize{color:#64748b;font-size:11.5px;flex-shrink:0}
.file-list .fitem.dir .fname{color:#60a5fa}
.file-list .fitem.back .fname{color:#fbbf24}
.file-list .fitem .fdl{background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;border-radius:6px;padding:3px 10px;font-size:13px;line-height:1.2;margin:0;flex-shrink:0}
.file-list .fitem .fdl:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.file-list .fitem.dir .fdl{display:none}

/* release 列表 */
.release-list{padding:8px 0}
.release-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.release-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.release-tag{font-weight:700;font-size:15px;color:#60a5fa;font-family:ui-monospace,Menlo,Consolas,monospace}
.release-time{color:var(--muted);font-size:12px}
.release-badge{display:inline-block;padding:1px 8px;font-size:11px;border-radius:4px;font-weight:600}
.release-badge.latest{background:rgba(16,185,129,.15);color:#34d399}
.release-badge.pre{background:rgba(245,158,11,.15);color:#fbbf24}
.release-body{color:#cbd5e1;font-size:13px;line-height:1.6;margin:6px 0;white-space:pre-wrap;max-height:120px;overflow:auto}
.release-assets{margin:8px 0;border-top:1px solid var(--border);padding-top:8px}
.asset-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;flex-wrap:wrap}
.asset-row a{word-break:break-all;overflow-wrap:anywhere;flex:1;min-width:120px}
.asset-row .asset-meta{color:var(--muted);font-size:11.5px;flex-shrink:0}
.release-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.release-actions button,.release-actions a.btn-link{margin:0;padding:5px 12px;font-size:12px;border-radius:6px;text-decoration:none;display:inline-block;line-height:1.4}
.release-actions a.btn-link{background:transparent;border:1px solid var(--border);color:var(--text)}
.release-actions a.btn-link:hover{background:var(--card);text-decoration:none}
.release-actions button.rollback{background:transparent;border:1px solid #f59e0b;color:#fbbf24}
.release-actions button.rollback:hover{background:rgba(245,158,11,.15)}

@media(max-width:640px){
  .modal-overlay{padding:8px}
  .modal-box{max-height:94vh}
  .modal-head{padding:12px 14px;font-size:13px}
  .modal-box pre.log{font-size:11.5px;padding:12px}
  .modal-extras{padding:10px 12px;font-size:12px}
  .modal-extras .xlabel{min-width:60px}
  .file-list .fitem{padding:10px 12px;font-size:12.5px}
}

.sync-badge{display:inline-block;padding:1px 8px;font-size:11px;border-radius:4px;background:rgba(59,130,246,.12);color:#93c5fd;white-space:nowrap}
.sync-badge.active{background:rgba(167,139,250,.15);color:#c4b5fd}

.sync-dialog-body{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sync-dialog-body label{margin:0;font-size:13px;color:var(--muted)}
.sync-dialog-body select{padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.sync-dialog-status{margin-top:6px}
.sync-status-row{padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5}
.sync-status-row.ok{background:rgba(16,185,129,.1);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
.sync-status-row.err{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.sync-status-row.muted{background:rgba(139,156,186,.08);color:var(--muted);border:1px solid var(--border)}
.sync-status-row .sync-msg{margin-top:6px;font-size:11.5px;color:inherit;opacity:.85;word-break:break-all;overflow-wrap:anywhere;white-space:pre-wrap}
.sync-dialog-actions{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--card2)}
.sync-dialog-actions button{flex:1;margin:0}

.upload-progress{padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(59,130,246,.06);flex-shrink:0;display:none}
.upload-progress.show{display:block}
.upload-progress .bar-wrap{height:8px;background:#1e293b;border-radius:4px;overflow:hidden;margin-top:8px}
.upload-progress .bar{height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:4px;transition:width .15s ease}
.upload-progress .info{display:flex;justify-content:space-between;font-size:12.5px;color:#93c5fd;font-weight:500}
.upload-progress .info .pct{font-weight:700;font-size:14px;color:#60a5fa}

.modal-editor{flex:1;display:none;flex-direction:column;background:#050b17;min-height:0;overflow:hidden}
.modal-editor.show{display:flex;position:fixed;inset:0;z-index:400;height:100vh;width:100vw;background:#050b17}
.modal-editor .editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card2);gap:10px;flex-wrap:wrap;flex-shrink:0}
.modal-editor .editor-path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#93c5fd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.modal-editor .editor-actions{display:flex;gap:8px;flex-shrink:0}
.modal-editor .editor-actions button{margin:0;padding:5px 12px;font-size:12px}
.modal-editor textarea{flex:1;background:#050b17;color:#e2e8f0;border:0;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;resize:none;outline:none;min-height:300px;width:100%;display:block}
@media(max-width:640px){.modal-editor.show{min-height:80vh}}

.diff-view{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;background:#050b17;padding:0;overflow:auto;max-height:60vh}
.diff-line{white-space:pre;padding:0 12px;min-height:19px}
.diff-line.add{background:rgba(16,185,129,.09);color:#6ee7b7}
.diff-line.del{background:rgba(239,68,68,.09);color:#fca5a5}
.diff-line.hunk{background:rgba(59,130,246,.12);color:#93c5fd;font-weight:500;padding-top:2px;padding-bottom:2px}
.diff-line.meta{color:#64748b;font-style:italic}
.diff-line.ctx{color:#94a3b8}
.diff-header{padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border);font-size:12.5px;color:#cbd5e1;display:flex;gap:14px;flex-wrap:wrap;flex-shrink:0}
.diff-header .stat-add{color:#34d399;font-weight:600}
.diff-header .stat-del{color:#f87171;font-weight:600}
.diff-header .commit-msg{color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.diff-empty{padding:30px;text-align:center;color:#8b9cba;font-size:13px}
.hist-list{padding:6px 0;overflow:auto;flex:1;min-height:0;background:#050b17}
.hist-item{padding:10px 14px;border-bottom:1px solid rgba(30,41,59,.5);cursor:pointer;transition:background .12s}
.hist-item:hover{background:rgba(59,130,246,.1)}
.hist-item.expanded{background:rgba(59,130,246,.08)}
.hist-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.hist-sha{font-family:ui-monospace,Menlo,Consolas,monospace;color:#60a5fa;font-weight:600;flex-shrink:0}
.hist-msg{color:#cbd5e1;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:150px}
.hist-meta{color:#64748b;font-size:11.5px;flex-shrink:0}
.hist-arrow{color:#64748b;font-size:11px;flex-shrink:0}

.restore-btn{background:transparent;border:1px solid #f59e0b;color:#fbbf24;padding:3px 10px;font-size:11.5px;border-radius:5px;cursor:pointer;margin-left:auto;flex-shrink:0}
.restore-btn:hover{background:rgba(245,158,11,.15)}
.restore-btn:disabled{opacity:.4;cursor:not-allowed}
.hist-row .hist-actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto}

.readme-dialog-body{flex:1;display:flex;flex-direction:column;min-height:0;background:#050b17;overflow:hidden}
.readme-dialog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card2);flex-shrink:0;flex-wrap:wrap}
.readme-dialog-toolbar .info{font-size:12.5px;color:#93c5fd}
.readme-dialog-toolbar button{margin:0;padding:5px 12px;font-size:12px}
.readme-dialog-body textarea{flex:1;background:#050b17;color:#e2e8f0;border:0;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;resize:none;outline:none;min-height:400px;width:100%;display:block}
.readme-dialog-actions{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--card2);flex-shrink:0}
.readme-dialog-actions button{flex:1;margin:0}
@media(max-width:640px){.readme-dialog-body textarea{min-height:55vh;font-size:12.5px}}

.prompt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn .15s ease;overflow-y:auto}
.prompt-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:popIn .15s ease;margin:auto}
.prompt-title{padding:18px 60px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px;color:#e2e8f0;letter-spacing:.2px}
.prompt-message{padding:18px 60px 0;font-size:15px;color:#cbd5e1;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.prompt-input{margin:16px 60px 0;padding:13px 16px;background:#0f172a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;outline:none;width:calc(100% - 120px);transition:border-color .15s}
.prompt-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.prompt-hint{padding:12px 60px 0;font-size:13px;color:var(--muted);line-height:1.7;white-space:pre-wrap;word-break:break-all}
.prompt-actions{display:flex;gap:12px;padding:20px 60px 18px}
.prompt-actions button{flex:1;margin:0;padding:12px 18px;font-size:15px}
@media(max-width:640px){
  .prompt-overlay{padding:14px}
  .prompt-box{max-width:100%}
  .prompt-title{padding:16px 48px;font-size:15.5px}
  .prompt-message{padding:16px 48px 0;font-size:14.5px}
  .prompt-input{margin:14px 48px 0;width:calc(100% - 96px);padding:12px 14px;font-size:15px}
  .prompt-hint{padding:10px 48px 0;font-size:12.5px}
  .prompt-actions{padding:16px 48px 14px;gap:10px}
  .prompt-actions button{padding:11px 16px;font-size:14.5px}
}

.modal-editor .CodeMirror{flex:1;height:100% !important;width:100%;font-size:13px;line-height:1.6;background:#050b17}
.modal-editor .CodeMirror-scroll{min-height:100%}
.modal-editor .CodeMirror-lines{padding:8px 0}
.modal-editor .CodeMirror pre.CodeMirror-line{padding:0 14px}
.modal-editor .CodeMirror-gutters{background:#0b1220;border-right:1px solid #1e293b}
@media(max-width:640px){.modal-editor .CodeMirror{font-size:12.5px}}

/* 查找替换面板 */
#cmFindPanel{position:fixed;left:0;right:0;bottom:0;background:#0b1220;border-top:1px solid #25334f;padding:10px 12px 12px;z-index:450;display:none;box-shadow:0 -4px 20px rgba(0,0,0,.5);font-size:13px}
#cmFindPanel.show{display:block}
#cmFindPanel .find-row,#cmFindPanel .replace-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#cmFindPanel input[type=text]{flex:1;padding:8px 10px;background:#0f172a;border:1px solid #25334f;border-radius:6px;color:#e2e8f0;font-size:13px;font-family:inherit;outline:none;min-width:0}
#cmFindPanel input[type=text]:focus{border-color:#3b82f6}
#cmFindPanel button{padding:7px 12px;font-size:12.5px;background:#1e293b;color:#cbd5e1;border:1px solid #25334f;border-radius:6px;cursor:pointer;margin:0;line-height:1.2;flex-shrink:0;font-family:inherit}
#cmFindPanel button:hover{background:#334155}
#cmFindPanel button.primary{background:#3b82f6;color:#fff;border-color:#3b82f6}
#cmFindPanel button.primary:hover{background:#2563eb}
#cmFindPanel .count{color:#93c5fd;font-size:12px;min-width:52px;text-align:center;flex-shrink:0}
#cmFindPanel .status{margin-top:4px;font-size:12px;color:#34d399;min-height:16px}
#cmFindPanel .status.err{color:#f87171}
#cmFindPanel .btn-group{display:flex;gap:6px;flex-shrink:0}

/* CodeMirror 匹配高亮 */
.cm-match-all{background:#fbbf24 !important;color:#1a1a1a !important;border-radius:2px}
.cm-match-current{background:#3b82f6 !important;color:#ffffff !important;border-radius:2px}
.cm-replaced{background:#10b981 !important;color:#ffffff !important;border-radius:2px}
.cm-match-all *,.cm-match-current *,.cm-replaced *{color:inherit !important}

/* 编辑器底部位移 */
.modal-editor.show{padding-bottom:0;transition:padding-bottom .15s}
.modal-editor.show.find-open{padding-bottom:135px}

@media(max-width:640px){
  #cmFindPanel{padding:8px 10px 10px;font-size:12.5px}
  #cmFindPanel .find-row,#cmFindPanel .replace-row{gap:5px}
  #cmFindPanel button{padding:6px 9px;font-size:12px}
  #cmFindPanel input[type=text]{padding:7px 9px;font-size:12.5px}
  .modal-editor.show.find-open{padding-bottom:155px}
}

<script>
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

window.onModalBack = null;
function modalBack() {
  if (typeof window.onModalBack === 'function') window.onModalBack();
}
function showBackBtn(show) {
  var b = document.getElementById('modalBackBtn');
  if (b) b.style.display = show ? 'inline-block' : 'none';
}


function showUploadProgress(loaded, total, startTime) {
  var el = document.getElementById('uploadProgress');
  if (!el) return;
  el.className = 'upload-progress show';
  var pct = total > 0 ? Math.round(loaded / total * 100) : 0;
  document.getElementById('uploadPct').textContent = pct + '%';
  document.getElementById('uploadBar').style.width = pct + '%';
  var mb = (loaded / 1024 / 1024).toFixed(1);
  var totalMb = (total / 1024 / 1024).toFixed(1);
  document.getElementById('uploadBytes').textContent = mb + ' / ' + totalMb + ' MB';
  if (startTime) {
    var elapsed = (Date.now() - startTime) / 1000;
    if (elapsed > 0.3) {
      var speed = (loaded / elapsed / 1024 / 1024).toFixed(1);
      document.getElementById('uploadSpeed').textContent = speed + ' MB/s';
    }
  }
  if (pct >= 100) {
    document.getElementById('uploadLabel').textContent = '上传完成，正在处理';
  } else {
    document.getElementById('uploadLabel').textContent = '正在上传';
  }
}

function hideUploadProgress() {
  var el = document.getElementById('uploadProgress');
  if (el) el.className = 'upload-progress';
}


var _editCtx = {owner: '', repo: '', path: '', sha: '', content: ''};

function showEditBtn(show) {
  var b = document.getElementById('modalEditBtn');
  if (b) b.style.display = show ? 'inline-block' : 'none';
}

function guessModeByPath(path) {
  var p = (path || '').toLowerCase();
  if (p.endsWith('.md') || p.endsWith('.markdown')) return 'markdown';
  if (p.endsWith('.json')) return {name: 'javascript', json: true};
  if (p.endsWith('.ts') || p.endsWith('.tsx') || p.endsWith('.jsx') || p.endsWith('.js') || p.endsWith('.mjs') || p.endsWith('.cjs')) return 'javascript';
  if (p.endsWith('.py')) return 'python';
  if (p.endsWith('.html') || p.endsWith('.htm')) return 'htmlmixed';
  if (p.endsWith('.xml')) return 'xml';
  if (p.endsWith('.css')) return 'css';
  if (p.endsWith('.yaml') || p.endsWith('.yml')) return 'yaml';
  if (p.endsWith('.sh') || p.endsWith('.bash')) return 'shell';
  if (p === 'dockerfile' || p.endsWith('/dockerfile') || p.endsWith('.dockerfile')) return 'dockerfile';
  if (p.endsWith('.go')) return 'go';
  if (p.endsWith('.java') || p.endsWith('.c') || p.endsWith('.cpp') || p.endsWith('.h') || p.endsWith('.hpp') || p.endsWith('.cs') || p.endsWith('.kt')) return 'clike';
  if (p.endsWith('.sql')) return 'sql';
  return null;
}


var _cmFindState = {matches: [], current: -1};

function cmOpenFind() {
  if (!_cmEditor) return;
  var panel = document.getElementById('cmFindPanel');
  panel.classList.add('show');
  var editor = document.getElementById('modalEditor');
  if (editor) editor.classList.add('find-open');
  setTimeout(function() {
    if (_cmEditor) { _cmEditor.refresh(); }
    document.getElementById('cmFindInput').focus();
    document.getElementById('cmFindInput').select();
  }, 60);
}

function cmCloseFind() {
  var panel = document.getElementById('cmFindPanel');
  panel.classList.remove('show');
  var editor = document.getElementById('modalEditor');
  if (editor) editor.classList.remove('find-open');
  cmClearAllMarks();
  document.getElementById('cmFindInput').value = '';
  document.getElementById('cmReplaceInput').value = '';
  document.getElementById('cmFindCount').textContent = '';
  document.getElementById('cmReplaceStatus').textContent = '';
  setTimeout(function() { if (_cmEditor) { _cmEditor.refresh(); _cmEditor.focus(); } }, 60);
}

function cmClearAllMarks() {
  if (_cmEditor) {
    try { _cmEditor.getAllMarks().forEach(function(m) { m.clear(); }); } catch (e) {}
  }
  _cmFindState.matches = [];
  _cmFindState.current = -1;
}

function cmClearHighlightsOnly() {
  if (_cmEditor) {
    try {
      _cmEditor.getAllMarks().forEach(function(m) {
        var cls = m.className || '';
        if (cls.indexOf('cm-match-all') >= 0 || cls.indexOf('cm-match-current') >= 0) {
          m.clear();
        }
      });
    } catch (e) {}
  }
}

function cmRunSearch() {
  if (!_cmEditor) return;
  var query = document.getElementById('cmFindInput').value;
  cmClearHighlightsOnly();
  _cmFindState.matches = [];
  _cmFindState.current = -1;
  document.getElementById('cmReplaceStatus').textContent = '';
  if (!query) {
    document.getElementById('cmFindCount').textContent = '';
    return;
  }
  try {
    var cursor = _cmEditor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
    while (cursor.findNext()) {
      var from = cursor.from();
      var to = cursor.to();
      var mark = _cmEditor.markText(from, to, {className: 'cm-match-all'});
      _cmFindState.matches.push({from: from, to: to, mark: mark});
    }
  } catch (e) {
    console.error(e);
  }
  if (_cmFindState.matches.length > 0) {
    _cmFindState.current = 0;
    cmHighlightCurrent();
  } else {
    document.getElementById('cmFindCount').textContent = '无匹配';
  }
}

function cmHighlightCurrent() {
  if (!_cmEditor) return;
  _cmFindState.matches.forEach(function(m, i) {
    try { m.mark.clear(); } catch (e) {}
    var cls = (i === _cmFindState.current) ? 'cm-match-current' : 'cm-match-all';
    m.mark = _cmEditor.markText(m.from, m.to, {className: cls});
  });
  var cur = _cmFindState.matches[_cmFindState.current];
  if (cur) {
    try {
      _cmEditor.setSelection(cur.from, cur.to);
      _cmEditor.scrollIntoView({from: cur.from, to: cur.to}, 80);
    } catch (e) {}
  }
  document.getElementById('cmFindCount').textContent =
    (_cmFindState.current + 1) + '/' + _cmFindState.matches.length;
}

function cmFindNext() {
  if (_cmFindState.matches.length === 0) return;
  _cmFindState.current = (_cmFindState.current + 1) % _cmFindState.matches.length;
  cmHighlightCurrent();
}

function cmFindPrev() {
  if (_cmFindState.matches.length === 0) return;
  _cmFindState.current = (_cmFindState.current - 1 + _cmFindState.matches.length) % _cmFindState.matches.length;
  cmHighlightCurrent();
}

async function cmReplaceOne() {
  if (!_cmEditor) return;
  if (_cmFindState.current < 0 || _cmFindState.matches.length === 0) {
    document.getElementById('cmReplaceStatus').textContent = '没有匹配项';
    document.getElementById('cmReplaceStatus').className = 'status err';
    return;
  }
  var replace = document.getElementById('cmReplaceInput').value;
  var m = _cmFindState.matches[_cmFindState.current];
  var ok = await myConfirm({
    title: '确认替换',
    message: '确定将这一处替换为：\n\n' + (replace || '(空)'),
    okText: '替换'
  });
  if (!ok) return;

  var from = m.from;
  _cmEditor.replaceRange(replace, m.from, m.to, '+find-replace');
  var newTo = {line: from.line, ch: from.ch + replace.length};
  _cmEditor.markText(from, newTo, {className: 'cm-replaced'});

  // 重新查找
  cmRunSearch();
  var st = document.getElementById('cmReplaceStatus');
  st.textContent = '✅ 已替换 1 处';
  st.className = 'status';
}

async function cmReplaceAll() {
  if (!_cmEditor) return;
  if (_cmFindState.matches.length === 0) {
    document.getElementById('cmReplaceStatus').textContent = '没有匹配项';
    document.getElementById('cmReplaceStatus').className = 'status err';
    return;
  }
  var replace = document.getElementById('cmReplaceInput').value;
  var n = _cmFindState.matches.length;
  var ok = await myConfirm({
    title: '确认全部替换',
    message: '共找到 ' + n + ' 处匹配，\n确定全部替换为：\n\n' + (replace || '(空)'),
    okText: '全部替换'
  });
  if (!ok) return;

  // 从后往前替换，避免位置偏移
  var sorted = _cmFindState.matches.slice().sort(function(a, b) {
    if (a.from.line !== b.from.line) return b.from.line - a.from.line;
    return b.from.ch - a.from.ch;
  });
  var count = 0;
  sorted.forEach(function(m) {
    try {
      _cmEditor.replaceRange(replace, m.from, m.to, '+find-replace-all');
      var newTo = {line: m.from.line, ch: m.from.ch + replace.length};
      _cmEditor.markText(m.from, newTo, {className: 'cm-replaced'});
      count++;
    } catch (e) {}
  });

  _cmFindState.matches = [];
  _cmFindState.current = -1;
  document.getElementById('cmFindCount').textContent = '';
  var st = document.getElementById('cmReplaceStatus');
  st.textContent = '✅ 已全部替换 ' + count + ' 处';
  st.className = 'status';
}


function cmRedoReplace() {
  if (!_cmEditor) return;
  try { _cmEditor.redo(); } catch (e) {}
  cmRunSearch();
  var st = document.getElementById('cmReplaceStatus');
  st.textContent = '↷ 已重做';
  st.className = 'status';
}

function cmUndoReplace() {
  if (!_cmEditor) return;
  _cmEditor.undo();
  cmRunSearch();
  var st = document.getElementById('cmReplaceStatus');
  st.textContent = '↶ 已撤回上一步';
  st.className = 'status';
}

function startEditFromPreview() {
  if (!window._lastFileData) return;
  var d = window._lastFileData;
  _editCtx = {owner: d.owner, repo: d.repo, path: d.path, sha: d.sha, content: d.content};

  document.getElementById('editorPath').textContent = d.path;
  var ta = document.getElementById('editorTextarea');
  ta.value = d.content;

  document.getElementById('modalLog').style.display = 'none';
  document.getElementById('modalFileList').style.display = 'none';
  var ex = document.getElementById('modalExtras');
  if (ex) ex.className = 'modal-extras';
  var st = document.getElementById('modalSteps');
  if (st) st.style.display = 'none';
  document.getElementById('modalEditor').className = 'modal-editor show';
  document.getElementById('modalEditBtn').style.display = 'none';
  var hb = document.getElementById('modalHistoryBtn');
  if (hb) hb.style.display = 'none';

  setTimeout(function() {
    if (typeof CodeMirror !== 'undefined') {
      if (_cmEditor) {
        try { _cmEditor.toTextArea(); } catch (e) {}
        _cmEditor = null;
      }
      _cmEditor = CodeMirror.fromTextArea(ta, {
        lineNumbers: true,
        mode: guessModeByPath(d.path),
        theme: 'dracula',
        autoCloseBrackets: true,
        matchBrackets: true,
        styleActiveLine: true,
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true
      });
      setTimeout(function() {
        if (_cmEditor) {
          _cmEditor.setSize('100%', '100%');
          _cmEditor.refresh();
          _cmEditor.focus();
          _cmEditor.setCursor(0, 0);
        }
      }, 80);
    } else {
      ta.focus();
      try { ta.setSelectionRange(0, 0); } catch (e) {}
    }
  }, 30);
}
function cancelEdit() {
  document.getElementById('modalEditor').className = 'modal-editor';
  document.getElementById('modalLog').style.display = 'block';
  if (window._lastFileData) showEditBtn(true);
}

async function saveEdit() {
  var content = _cmEditor ? _cmEditor.getValue() : document.getElementById('editorTextarea').value;
  if (content === _editCtx.content) {
    cancelEdit();
    return;
  }
  var message = await myPrompt({
    title: '提交修改',
    message: _editCtx.path,
    defaultValue: 'update ' + _editCtx.path,
    placeholder: 'commit message'
  });
  if (message === null) return;
  if (!message.trim()) message = 'update ' + _editCtx.path;

  var btn = document.getElementById('saveEditBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    var r = await fetch('/api/repos/save_file', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        owner: _editCtx.owner,
        repo: _editCtx.repo,
        path: _editCtx.path,
        content: content,
        sha: _editCtx.sha,
        message: message.trim()
      })
    });
    var j = await r.json();
    if (j.error) {
      alert('保存失败: ' + j.error);
      return;
    }
    // 更新缓存
    _editCtx.content = content;
    if (window._lastFileData) {
      window._lastFileData.content = content;
    }
    // 回预览
    if (_cmEditor) {
      try { _cmEditor.toTextArea(); } catch (e) {}
      _cmEditor = null;
    }
    document.getElementById('modalEditor').className = 'modal-editor';
    document.getElementById('modalLog').style.display = 'block';
    showEditBtn(true);
    // 重新渲染
    if (typeof window._reloadPreview === 'function') window._reloadPreview();
    var tip = j.commit_url ? ('\n\n提交：' + j.commit_url) : '';
    setTimeout(function() {
      var log = document.getElementById('modalLog');
      log.innerHTML += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid #1e293b;color:#34d399">✅ 已保存' + tip + '</div>';
    }, 100);
  } catch (e) {
    alert('保存失败: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
}


var _histCtx = {owner: '', repo: '', path: '', expanded: null};

function showHistoryBtn(show) {
  var b = document.getElementById('modalHistoryBtn');
  if (b) b.style.display = show ? 'inline-block' : 'none';
}

async function showFileHistory() {
  if (!window._lastFileData) return;
  var d = window._lastFileData;
  _histCtx = {owner: d.owner, repo: d.repo, path: d.path, expanded: null};

  // 切到日志视图
  document.getElementById('modalEditor').className = 'modal-editor';
  document.getElementById('modalFileList').style.display = 'none';
  document.getElementById('modalSteps').style.display = 'none';
  document.getElementById('modalLog').style.display = 'block';
  document.getElementById('modalLog').innerHTML = '<div class="diff-empty">加载提交历史...</div>';
  showEditBtn(false);
  showHistoryBtn(false);

  try {
    var r = await fetch('/api/repos/file_history?owner=' + encodeURIComponent(d.owner) +
                        '&repo=' + encodeURIComponent(d.repo) +
                        '&path=' + encodeURIComponent(d.path));
    var j = await r.json();
    if (j.empty_repo) {
      document.getElementById('modalLog').innerHTML = '<div class="diff-empty">这个文件还没有提交历史（仓库为空或文件未被提交过）</div>';
      return;
    }
    if (j.error) { document.getElementById('modalLog').innerHTML = '<div class="diff-empty">错误: ' + escHtml(j.error) + '</div>'; return; }
    renderHistory(j.commits || []);
  } catch (e) {
    document.getElementById('modalLog').innerHTML = '<div class="diff-empty">加载失败: ' + escHtml(e.message) + '</div>';
  }
}

function renderHistory(commits) {
  var el = document.getElementById('modalLog');
  if (!commits.length) {
    el.innerHTML = '<div class="diff-empty">还没有任何提交历史</div>';
    return;
  }
  var html = '<div class="hist-list">';
  commits.forEach(function(c) {
    var key = c.sha;
    var expanded = _histCtx.expanded === key;
    html += '<div class="hist-item' + (expanded ? ' expanded' : '') + '" id="hist-' + key + '">' +
      '<div class="hist-row">' +
        '<span class="hist-arrow" onclick="toggleCommit(\'' + key + '\')">' + (expanded ? '▼' : '▶') + '</span>' +
        '<span class="hist-sha" onclick="toggleCommit(\'' + key + '\')">' + escHtml(c.short) + '</span>' +
        '<span class="hist-msg" onclick="toggleCommit(\'' + key + '\')">' + escHtml(c.message) + '</span>' +
        '<span class="hist-meta">' + escHtml(c.author) + ' · ' + escHtml(c.date) + '</span>' +
        '<span class="hist-actions">' +
          '<button class="restore-btn" type="button" onclick="event.stopPropagation(); restoreFile(\'' + key + '\')">↺ 恢复到此版本</button>' +
        '</span>' +
      '</div>' +
      (expanded ? '<div class="diff-wrap" id="diff-' + key + '"><div class="diff-empty">加载差异...</div></div>' : '') +
    '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

async function toggleCommit(sha) {
  // 如果已经展开 → 收起
  if (_histCtx.expanded === sha) {
    _histCtx.expanded = null;
    // 重新渲染（保持滚动位置太复杂，直接重渲染）
    var r2 = await fetch('/api/repos/file_history?owner=' + encodeURIComponent(_histCtx.owner) +
                        '&repo=' + encodeURIComponent(_histCtx.repo) +
                        '&path=' + encodeURIComponent(_histCtx.path));
    var j2 = await r2.json();
    renderHistory(j2.commits || []);
    return;
  }
  _histCtx.expanded = sha;
  // 展开前先重新渲染结构
  var r = await fetch('/api/repos/file_history?owner=' + encodeURIComponent(_histCtx.owner) +
                      '&repo=' + encodeURIComponent(_histCtx.repo) +
                      '&path=' + encodeURIComponent(_histCtx.path));
  var j = await r.json();
  renderHistory(j.commits || []);
  // 再加载 diff
  loadDiff(sha);
}

async function loadDiff(sha) {
  var wrap = document.getElementById('diff-' + sha);
  if (!wrap) return;
  try {
    var r = await fetch('/api/repos/file_diff?owner=' + encodeURIComponent(_histCtx.owner) +
                        '&repo=' + encodeURIComponent(_histCtx.repo) +
                        '&path=' + encodeURIComponent(_histCtx.path) +
                        '&sha=' + encodeURIComponent(sha));
    var j = await r.json();
    if (j.error) { wrap.innerHTML = '<div class="diff-empty">' + escHtml(j.error) + '</div>'; return; }
    wrap.innerHTML = renderDiff(j);
  } catch (e) {
    wrap.innerHTML = '<div class="diff-empty">加载失败: ' + escHtml(e.message) + '</div>';
  }
}

function renderDiff(d) {
  var html = '<div class="diff-header">' +
    '<span>状态: <b>' + escHtml(d.status) + '</b></span>' +
    '<span class="stat-add">+' + (d.additions || 0) + '</span>' +
    '<span class="stat-del">-' + (d.deletions || 0) + '</span>' +
    '<span class="commit-msg">' + escHtml((d.message || '').split('\n')[0]) + '</span>' +
  '</div>';
  if (!d.patch) {
    html += '<div class="diff-empty">无差异内容（可能是二进制文件或改动过大被 GitHub 截断）</div>';
    return html;
  }
  var lines = d.patch.split('\n');
  html += '<div class="diff-view">';
  lines.forEach(function(line) {
    var cls = 'diff-line ctx';
    if (line.indexOf('@@') === 0) cls = 'diff-line hunk';
    else if (line.indexOf('+++') === 0 || line.indexOf('---') === 0) cls = 'diff-line meta';
    else if (line.indexOf('+') === 0) cls = 'diff-line add';
    else if (line.indexOf('-') === 0) cls = 'diff-line del';
    html += '<div class="' + cls + '">' + escHtml(line) + '</div>';
  });
  html += '</div>';
  return html;
}


async function restoreFile(sha) {
  if (!_histCtx.owner || !_histCtx.repo || !_histCtx.path) return;
  var shortSha = sha.slice(0, 7);
  var confirmed = confirm(
    '⚠️ 恢复文件到旧版本\n\n' +
    '文件：' + _histCtx.path + '\n' +
    '目标 commit：' + shortSha + '\n\n' +
    '会把该文件当前内容替换成这个旧版本的内容，并提交一次新的 commit。\n' +
    '其他文件不受影响。\n\n' +
    '确认恢复？'
  );
  if (!confirmed) return;
  try {
    var r = await fetch('/api/repos/restore_file', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        owner: _histCtx.owner,
        repo: _histCtx.repo,
        path: _histCtx.path,
        sha: sha
      })
    });
    var j = await r.json();
    if (j.error) { alert('恢复失败: ' + j.error); return; }
    var msg = '✅ 已恢复到 ' + shortSha;
    if (j.commit_url) msg += '\n\n新提交：' + j.commit_url;
    alert(msg);
    // 刷新历史
    showFileHistory();
  } catch (e) {
    alert('请求失败: ' + e.message);
  }
}

function myConfirm(opts) {
  opts = opts || {};
  return new Promise(function(resolve) {
    var overlay = document.createElement('div');
    overlay.className = 'prompt-overlay';
    var box = document.createElement('div');
    box.className = 'prompt-box';
    var title = document.createElement('div');
    title.className = 'prompt-title';
    title.textContent = opts.title || '确认';
    box.appendChild(title);
    if (opts.message) {
      var msg = document.createElement('div');
      msg.className = 'prompt-message';
      msg.textContent = opts.message;
      box.appendChild(msg);
    }
    var actions = document.createElement('div');
    actions.className = 'prompt-actions';
    var btnCancel = document.createElement('button');
    btnCancel.className = 'ghost';
    btnCancel.type = 'button';
    btnCancel.textContent = opts.cancelText || '取消';
    var btnOk = document.createElement('button');
    btnOk.type = 'button';
    btnOk.textContent = opts.okText || '确定';
    actions.appendChild(btnCancel);
    actions.appendChild(btnOk);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    var closed = false;
    function close(val) {
      if (closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      resolve(val);
    }
    function onKey(e) {
      if (e.key === 'Escape') close(false);
      else if (e.key === 'Enter') { e.preventDefault(); close(true); }
    }
    btnCancel.addEventListener('click', function() { close(false); });
    btnOk.addEventListener('click', function() { close(true); });
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) close(false);
    });
    document.addEventListener('keydown', onKey);
    setTimeout(function() { btnOk.focus(); }, 50);
  });
}

function myPrompt(opts) {
  opts = opts || {};
  return new Promise(function(resolve) {
    var overlay = document.createElement('div');
    overlay.className = 'prompt-overlay';

    var box = document.createElement('div');
    box.className = 'prompt-box';

    var isMobile = window.innerWidth <= 640;
    var PAD = isMobile ? '16px 24px' : '18px 32px';
    var PAD_TOP = isMobile ? '16px 24px 0' : '18px 32px 0';
    var INPUT_MARGIN = isMobile ? '14px 24px 0' : '16px 32px 0';
    var INPUT_WIDTH = isMobile ? 'calc(100% - 48px)' : 'calc(100% - 64px)';
    var HINT_PAD = isMobile ? '10px 24px 0' : '12px 32px 0';
    var ACT_PAD = isMobile ? '16px 24px 14px' : '20px 32px 18px';

    var title = document.createElement('div');
    title.className = 'prompt-title';
    title.textContent = opts.title || '输入';
    title.style.cssText = 'padding:' + PAD + ';border-bottom:1px solid #25334f;font-weight:600;font-size:16px;color:#e2e8f0;letter-spacing:.2px';

    box.appendChild(title);

    if (opts.message) {
      var msg = document.createElement('div');
      msg.className = 'prompt-message';
      msg.textContent = opts.message;
      msg.style.cssText = 'padding:' + PAD_TOP + ';font-size:15px;color:#cbd5e1;line-height:1.7;white-space:pre-wrap;word-break:break-word';
      box.appendChild(msg);
    }

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'prompt-input';
    input.value = opts.defaultValue || '';
    input.placeholder = opts.placeholder || '';
    input.style.cssText = 'margin:' + INPUT_MARGIN + ';padding:13px 16px;background:#0f172a;border:1px solid #25334f;border-radius:10px;color:#e2e8f0;font-size:15px;font-family:inherit;outline:none;width:' + INPUT_WIDTH + ';box-sizing:border-box';
    box.appendChild(input);

    if (opts.hint) {
      var hint = document.createElement('div');
      hint.className = 'prompt-hint';
      hint.textContent = opts.hint;
      hint.style.cssText = 'padding:' + HINT_PAD + ';font-size:13px;color:#8b9cba;line-height:1.7;white-space:pre-wrap;word-break:break-all';
      box.appendChild(hint);
    }

    var actions = document.createElement('div');
    actions.className = 'prompt-actions';
    actions.style.cssText = 'display:flex;gap:12px;padding:' + ACT_PAD;
    var btnCancel = document.createElement('button');
    btnCancel.className = 'ghost';
    btnCancel.type = 'button';
    btnCancel.textContent = '取消';
    var btnOk = document.createElement('button');
    btnOk.type = 'button';
    btnOk.textContent = '确定';
    actions.appendChild(btnCancel);
    actions.appendChild(btnOk);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    var closed = false;
    function close(val) {
      if (closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      resolve(val);
    }

    function onKey(e) {
      if (e.key === 'Escape') close(null);
      else if (e.key === 'Enter' && document.activeElement === input) {
        e.preventDefault();
        close(input.value);
      }
    }

    btnCancel.addEventListener('click', function() { close(null); });
    btnOk.addEventListener('click', function() { close(input.value); });
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) close(null);
    });
    document.addEventListener('keydown', onKey);

    setTimeout(function() {
      input.focus();
      try { input.setSelectionRange(0, input.value.length); } catch (e) {}
    }, 60);
  });
}

var _cmEditor = null;


var _uploadCtx = {owner: '', repo: '', dir: '', files: [], currentNames: []};
var _uploadXHR = null;

function openUploadDialog(owner, repo, dir, currentNames) {
  _uploadCtx = {owner: owner, repo: repo, dir: dir || '', files: [], currentNames: currentNames || []};
  document.getElementById('uploadInput').value = '';
  document.getElementById('uploadFileList').innerHTML = '';
  document.getElementById('uploadDialogTitle').textContent = '上传文件 · ' + (dir || '根目录');
  var hint = document.getElementById('uploadHint');
  hint.textContent = '上传到：' + (dir ? ('/' + dir) : '/') + '\n单文件上限 25 MB。\n⚠️ 大文件（>5MB）会走 GitHub API，速度较慢，请耐心等待。\n如需上传大文件，建议改用首页「发布项目」上传 zip。';
  hint.style.whiteSpace = 'pre-line';
  setUploadBtnState();
  document.getElementById('uploadDialog').style.display = 'flex';
}

function closeUploadDialog() {
  if (_uploadXHR) {
    try { _uploadXHR.abort(); } catch (e) {}
    _uploadXHR = null;
  }
  document.getElementById('uploadDialog').style.display = 'none';
  document.getElementById('uploadProgressBar').classList.remove('show');
  document.getElementById('uploadProgressText').classList.remove('show');
  _uploadCtx.files = [];
}

function setUploadBtnState() {
  var btn = document.getElementById('uploadStartBtn');
  var hasValid = _uploadCtx.files.some(function(f) { return f.size <= 25 * 1024 * 1024; });
  btn.disabled = !hasValid;
  btn.style.opacity = hasValid ? '1' : '.5';
}

function onUploadFilesSelected() {
  var input = document.getElementById('uploadInput');
  _uploadCtx.files = Array.from(input.files || []);
  var box = document.getElementById('uploadFileList');
  if (!_uploadCtx.files.length) { box.innerHTML = ''; setUploadBtnState(); return; }
  var html = '';
  _uploadCtx.files.forEach(function(f) {
    var over = f.size > 25 * 1024 * 1024;
    var big = f.size > 5 * 1024 * 1024;
    var sz = f.size < 1024 ? (f.size + ' B')
           : (f.size < 1024 * 1024 ? (f.size / 1024).toFixed(1) + ' KB'
           : (f.size / 1024 / 1024).toFixed(2) + ' MB');
    var tag = '';
    if (over) tag = ' · 超限将被拒绝';
    else if (big) tag = ' · 大文件较慢';
    html += '<div class="upload-file-item' + (over ? ' over' : '') + '">' +
      '<span class="fn">' + escHtml(f.name) + '</span>' +
      '<span class="fs">' + sz + tag + '</span>' +
      '</div>';
  });
  box.innerHTML = html;
  setUploadBtnState();
}

async function doUploadFiles() {
  var valid = _uploadCtx.files.filter(function(f) { return f.size <= 25 * 1024 * 1024; });
  if (!valid.length) { alert('没有可上传的文件'); return; }

  // 检查同名
  var same = valid.filter(function(f) {
    return _uploadCtx.currentNames.indexOf(f.name) >= 0;
  });
  var overwrite = 0;
  if (same.length) {
    var names = same.map(function(f) { return f.name; }).join('\n');
    var ok = await myConfirm({
      title: '文件已存在',
      message: '以下文件已存在：\n\n' + names + '\n\n是否覆盖？',
      okText: '覆盖上传'
    });
    if (!ok) return;
    overwrite = 1;
  }

  var btn = document.getElementById('uploadStartBtn');
  btn.disabled = true;
  btn.textContent = '上传中...';
  var bar = document.getElementById('uploadProgressBar');
  var barInner = document.getElementById('uploadProgressBarInner');
  var barText = document.getElementById('uploadProgressText');
  bar.classList.add('show');
  barText.classList.add('show');
  barInner.style.width = '0%';
  barText.textContent = '准备上传...';

  var fd = new FormData();
  fd.append('owner', _uploadCtx.owner);
  fd.append('repo', _uploadCtx.repo);
  fd.append('dir', _uploadCtx.dir);
  fd.append('overwrite', overwrite ? '1' : '0');
  valid.forEach(function(f) { fd.append('files', f); });

  var xhr = new XMLHttpRequest();
  _uploadXHR = xhr;
  var startTime = Date.now();
  xhr.open('POST', '/api/repos/upload_file');
  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      var pct = Math.round(e.loaded / e.total * 100);
      barInner.style.width = pct + '%';
      var mb = (e.loaded / 1024 / 1024).toFixed(2);
      var totalMb = (e.total / 1024 / 1024).toFixed(2);
      var elapsed = (Date.now() - startTime) / 1000;
      var speed = elapsed > 0.3 ? (e.loaded / elapsed / 1024 / 1024).toFixed(1) + ' MB/s' : '';
      barText.textContent = pct + '%  ' + mb + ' / ' + totalMb + ' MB' + (speed ? '  ·  ' + speed : '');
    }
  };
  xhr.upload.onload = function() {
    // 客户端到 NAS 上传完成，NAS 正在提交 GitHub
    bar.classList.add('submitting');
    barText.textContent = '⏳ 正在提交到 GitHub，请稍候...（文件越大越久）';
  };

  xhr.onload = function() {
    try {
      var j = JSON.parse(xhr.responseText);
      bar.classList.remove('submitting');
      if (j.error) { showToast('上传失败: ' + j.error, 'err'); return; }
      var results = j.results || [];
      var okCount = results.filter(function(x) { return x.ok; }).length;
      var failCount = results.filter(function(x) { return !x.ok; }).length;
      barInner.style.width = '100%';
      barText.textContent = '完成：成功 ' + okCount + ' 个' + (failCount ? ('，失败 ' + failCount + ' 个') : '');
      var msg = '上传完成：成功 ' + okCount + ' 个';
      if (failCount) msg += '，失败 ' + failCount + ' 个';
      showToast(msg, failCount ? 'err' : '');
      // 失败详情直接弹给用户看
      if (failCount) {
        var failDetail = results.filter(function(x) { return !x.ok; })
          .map(function(x) { return '• ' + x.name + '\n  ' + x.msg; }).join('\n\n');
        var okDetail = results.filter(function(x) { return x.ok; })
          .map(function(x) { return '• ' + x.name + ' — ' + x.msg; }).join('\n');
        var fullMsg = '';
        if (failDetail) fullMsg += '❌ 失败：\n' + failDetail;
        if (okDetail) fullMsg += (fullMsg ? '\n\n' : '') + '✅ 成功：\n' + okDetail;
        // 用 alert 保证用户能看到（弹窗里的进度条会挡住 toast）
        setTimeout(function() { alert(fullMsg); }, 300);
      }
      setTimeout(function() {
        closeUploadDialog();
        if (typeof window._reloadPreview === 'function') window._reloadPreview();
      }, 800);
    } catch (e) {
      showToast('响应解析失败', 'err');
    }
  };
  xhr.onerror = function() {
    showToast('网络错误', 'err');
  };
  xhr.onloadend = function() {
    _uploadXHR = null;
    btn.disabled = false;
    btn.textContent = '上传';
    bar.classList.remove('submitting');
    setTimeout(function() {
      bar.classList.remove('show');
      barText.classList.remove('show');
    }, 2000);
  };
  xhr.onabort = function() {
    showToast('已取消上传', 'info');
  };
  xhr.send(fd);
}

function openModal(title, content) {
  document.getElementById('modalTitle').textContent = title || '日志';
  document.getElementById('modalLog').textContent = content || '';
  var _log = document.getElementById('modalLog');
  if (_log) _log.style.display = 'block';
  var _fl = document.getElementById('modalFileList');
  if (_fl) { _fl.style.display = 'none'; _fl.innerHTML = ''; }
  var _ed = document.getElementById('modalEditor');
  if (_ed) _ed.className = 'modal-editor';
  var _eb = document.getElementById('modalEditBtn');
  if (_eb) _eb.style.display = 'none';
  var _hb = document.getElementById('modalHistoryBtn');
  if (_hb) _hb.style.display = 'none';
  var _hb = document.getElementById('modalHistoryBtn');
  if (_hb) _hb.style.display = 'none';
  var _up = document.getElementById('uploadProgress');
  if (_up) _up.className = 'upload-progress';
  var _steps = document.getElementById('modalSteps');
  if (_steps) { _steps.style.display = 'none'; _steps.innerHTML = ''; }
  if (typeof _cmEditor !== 'undefined' && _cmEditor) {
    try { _cmEditor.toTextArea(); } catch (err) {}
    _cmEditor = null;
  }
  var _bb = document.getElementById('modalBackBtn');
  if (_bb) _bb.style.display = 'none';
  var ex = document.getElementById('modalExtras');
  if (ex) { ex.className = 'modal-extras'; ex.innerHTML = ''; }
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

function renderLog(text) {
  var el = document.getElementById('modalLog');
  if (!el) return;
  el.style.display = 'block';
  var fl = document.getElementById('modalFileList');
  if (fl) fl.style.display = 'none';
  var escaped = escHtml(text == null ? '' : text);
  var linked = escaped.replace(/(https?:\/\/[^\s<>"']+)/g, function(u) {
    return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
  });
  el.innerHTML = linked;
}

function renderExtras(extras) {
  var el = document.getElementById('modalExtras');
  if (!el) return;
  if (!extras) { el.className = 'modal-extras'; el.innerHTML = ''; return; }
  var hasAny = extras.repo_url || extras.release_url || extras.pages_url ||
               (extras.assets && extras.assets.length);
  if (!hasAny) { el.className = 'modal-extras'; el.innerHTML = ''; return; }
  var html = '';
  if (extras.repo_url) {
    html += '<div class="xrow"><span class="xlabel">仓库</span><a href="' +
            escHtml(extras.repo_url) + '" target="_blank" rel="noopener">' +
            escHtml(extras.repo_url) + '</a></div>';
  }
  if (extras.release_url) {
    html += '<div class="xrow"><span class="xlabel">Release</span><a href="' +
            escHtml(extras.release_url) + '" target="_blank" rel="noopener">' +
            escHtml(extras.release_url) + '</a></div>';
  }
  if (extras.pages_url) {
    html += '<div class="xrow"><span class="xlabel">Pages</span><a href="' +
            escHtml(extras.pages_url) + '" target="_blank" rel="noopener">' +
            escHtml(extras.pages_url) + '</a></div>';
  }
  if (extras.assets && extras.assets.length) {
    extras.assets.forEach(function(a) {
      var url = a.accel || a.url;
      var cls = a.accel ? 'accel' : '';
      var label = a.accel ? '加速下载' : '下载';
      html += '<div class="xrow"><span class="xlabel">' + label + '</span>' +
              '<a class="' + cls + '" href="' + escHtml(url) +
              '" target="_blank" rel="noopener">' + escHtml(url) + '</a>' +
              (a.name ? '<span class="xname">(' + escHtml(a.name) + ')</span>' : '') +
              '</div>';
    });
  }
  el.innerHTML = html;
  el.className = 'modal-extras show';
}

var STEP_ORDER = ['create_repo', 'push_source', 'create_release', 'deploy_pages'];
var STEP_LABELS = {create_repo:'建仓库', push_source:'推代码', create_release:'建 Release', deploy_pages:'部署 Pages'};

function renderSteps(currentStep, status) {
  var el = document.getElementById('modalSteps');
  if (!el) return;
  el.style.display = 'flex';
  if (currentStep === 'done' || status === 'success') {
    var html = '';
    STEP_ORDER.forEach(function(k, i) {
      if (i > 0) html += '<span class="step-conn"></span>';
      html += '<div class="step-item done"><span class="step-dot"></span><span>' + STEP_LABELS[k] + '</span></div>';
    });
    el.innerHTML = html;
    return;
  }
  var idx = STEP_ORDER.indexOf(currentStep);
  if (idx < 0) { el.style.display = 'none'; return; }
  var html = '';
  STEP_ORDER.forEach(function(k, i) {
    if (i > 0) html += '<span class="step-conn"></span>';
    var cls = 'step-item';
    if (i < idx) cls += ' done';
    else if (i === idx) cls += (status === 'failed' ? ' failed' : ' active');
    html += '<div class="' + cls + '"><span class="step-dot"></span><span>' + STEP_LABELS[k] + '</span></div>';
  });
  el.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', function () {
  var m = document.getElementById('modal');
  if (m) m.addEventListener('click', function (e) {
    if (e.target.id === 'modal') closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
});
</script>
